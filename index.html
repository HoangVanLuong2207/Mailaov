<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lọc Mã Xác Minh</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      margin: 0;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 30px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #555;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 1em;
      border: 2px solid #ddd;
      border-radius: 5px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      font-size: 1em;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover:enabled {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover:enabled {
      background: #e0e0e0;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .result {
      margin-top: 30px;
      padding: 20px;
      border-radius: 5px;
      display: none;
      animation: slideUp 0.3s ease;
    }

    .result.show {
      display: block;
    }

    .result.success {
      background: #d4edda;
      border: 2px solid #28a745;
      color: #155724;
    }

    .result.error {
      background: #f8d7da;
      border: 2px solid #dc3545;
      color: #721c24;
    }

    .result.info {
      background: #d1ecf1;
      border: 2px solid #17a2b8;
      color: #0c5460;
    }

    .code-display {
      font-size: 2em;
      font-weight: bold;
      text-align: center;
      margin-top: 15px;
      font-family: 'Courier New', monospace;
      letter-spacing: 5px;
    }

    .log {
      background: #f5f5f5;
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 5px;
      margin-top: 20px;
      max-height: 300px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.85em;
    }

    .log-item {
      margin-bottom: 5px;
      padding: 5px 0;
    }

    .log-info {
      color: #0066cc;
    }

    .log-success {
      color: #28a745;
      font-weight: bold;
    }

    .log-error {
      color: #dc3545;
      font-weight: bold;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>📧 Lọc Mã Xác Minh API</h1>

    <div class="input-group">
      <label for="username">Nhập Username:</label>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="username" value="" placeholder="" style="flex: 2;">
        <select id="domain"
          style="flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 1em; cursor: pointer;">
          <option value="ruutukf.com">@ruutukf.com (Còn hỗ trợ)</option>
          <option value="batdongsanvgp.com">@batdongsanvgp.com (Ngừng hỗ trợ)</option>
        </select>
      </div>
    </div>

    <div class="button-group">
      <button class="btn-primary" onclick="fetchCode()">
        <span id="btn-text">Lấy Mã Xác Minh</span>
      </button>
      <button class="btn-secondary" onclick="clearResult()">Reset</button>
      <button class="btn-secondary" id="btn-copy" onclick="copyCode()" disabled>Copy mã</button>
      <button class="btn-secondary" onclick="window.open('account_email_suffix.html','_blank')">Ghép
        user|pass|email</button>
      <button class="btn-secondary" onclick="window.open('taochuoi.html','_blank')"> Tạo chuỗi</button>
    </div>

    <div id="result" class="result"></div>

    <div class="log" id="log"></div>
  </div>

  <script>
    // Lưu mã hiện tại để kiểm tra trùng lặp
    let currentCode = null;
    const MAX_RETRY = 3; // Số lần thử tối đa khi mã trùng

    function addLog(message, type = 'info') {
      const logDiv = document.getElementById('log');
      const timestamp = new Date().toLocaleTimeString();
      const item = document.createElement('div');
      item.className = `log-item log-${type}`;
      item.textContent = `[${timestamp}] ${message}`;
      logDiv.appendChild(item);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function showResult(message, type = 'info', code = null) {
      const resultDiv = document.getElementById('result');
      const btnCopy = document.getElementById('btn-copy');

      resultDiv.className = `result show ${type}`;

      let html = `<div>${message}</div>`;
      if (code) {
        html += `<div class="code-display" id="code-display">${code}</div>`;
        btnCopy.disabled = false; // Có mã thì cho copy
      } else {
        btnCopy.disabled = true;  // Không có mã thì tắt copy
      }
      resultDiv.innerHTML = html;
    }

    function clearResult() {
      document.getElementById('result').classList.remove('show');
      document.getElementById('log').innerHTML = '';
      document.getElementById('username').value = '';
      document.getElementById('btn-text').textContent = 'Lấy Mã Xác Minh';
      document.getElementById('btn-copy').disabled = true;
    }

    async function copyCode() {
      const codeEl = document.getElementById('code-display');
      const btnCopy = document.getElementById('btn-copy');

      if (!codeEl) {
        addLog('Không có mã để copy', 'error');
        return;
      }

      const code = codeEl.textContent.trim();
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(code);
        } else {
          // Fallback nếu clipboard API không hỗ trợ
          const textarea = document.createElement('textarea');
          textarea.value = code;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
        }
        addLog(`📋 Đã copy mã: ${code}`, 'success');
        const originalText = btnCopy.textContent;
        btnCopy.textContent = 'Đã copy ✔';
        setTimeout(() => {
          btnCopy.textContent = originalText;
        }, 1500);
      } catch (err) {
        addLog('❌ Copy thất bại: ' + err.message, 'error');
      }
    }

    // Hàm tự động copy mã (không cần element, truyền code trực tiếp)
    async function autoCopyCode(code) {
      const btnCopy = document.getElementById('btn-copy');
      let copied = false;

      // Thử Clipboard API trước
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(code);
          copied = true;
        }
      } catch (err) {
        // Clipboard API thất bại, sẽ dùng fallback
      }

      // Fallback: dùng execCommand (hoạt động khi không focus)
      if (!copied) {
        try {
          const textarea = document.createElement('textarea');
          textarea.value = code;
          textarea.style.position = 'fixed';
          textarea.style.left = '-9999px';
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          copied = document.execCommand('copy');
          document.body.removeChild(textarea);
        } catch (err) {
          addLog('⚠️ Tự động copy thất bại: ' + err.message, 'info');
          return;
        }
      }

      if (copied) {
        addLog(`📋 Tự động copy mã: ${code}`, 'success');
        btnCopy.textContent = 'Đã copy ✔';
        setTimeout(() => {
          btnCopy.textContent = 'Copy mã';
        }, 1500);
      }
    }

    async function fetchCode(retryCount = 0) {
      const username = document.getElementById('username').value.trim();
      const domain = document.getElementById('domain').value;
      const btnText = document.getElementById('btn-text');
      const btn = document.querySelector('.btn-primary');
      const btnCopy = document.getElementById('btn-copy');
      const originalText = 'Lấy Mã Xác Minh';

      if (!username) {
        showResult('❌ Vui lòng nhập username!', 'error');
        return;
      }

      // Chỉ reset giao diện khi lần đầu gọi (không phải retry)
      if (retryCount === 0) {
        document.getElementById('result').classList.remove('show');
        btnCopy.disabled = true;
        addLog(`Username: ${username}`, 'info');
      }

      btnText.innerHTML = retryCount > 0
        ? `<span class="loading"></span>Retry lần ${retryCount}...`
        : '<span class="loading"></span>Đang xử lý...';
      btn.disabled = true;

      const email = username.includes('@') ? username : `${username}@${domain}`;
      const apiUrl = `/api/get-code?username=${encodeURIComponent(email)}`;

      try {
        addLog(`Gọi backend: ${apiUrl}${retryCount > 0 ? ` (retry ${retryCount})` : ''}`, 'info');

        const response = await fetch(apiUrl, {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const result = await response.json();

        if (!result.ok) {
          throw new Error(result.error || 'Backend trả về lỗi');
        }

        const actualEmail = result.email || email;
        const data = result.raw;
        addLog(`✓ API proxy trả về dữ liệu cho ${actualEmail}`, 'success');

        if (Array.isArray(data)) {
          if (data.length === 0) {
            if (retryCount < 30) {
              addLog(`Hộp thư trống, đang đợi email... (lần ${retryCount + 1}/30)`, 'info');
              showResult(`⏳ Đang đợi email gửi tới hộp thư... (${retryCount + 1}/30)`, 'info');
              // Đợi 3 giây rồi kiểm tra lại
              await new Promise(resolve => setTimeout(resolve, 3000));
              return fetchCode(retryCount + 1);
            } else {
              throw new Error('Hết thời gian chờ email (quá 30 lần thử).');
            }
          }

          if (data[0] && data[0].body) {
            const body = data[0].body;
            addLog('✓ Tìm thấy body', 'success');

            // Lọc mã
            let code = null;
            let match;

            // Cách 1: <b>12345678</b>
            match = body.match(/<b[^>]*>(\d{8})<\/b>/);
            if (match) code = match[1];

            // Cách 2: **12345678**
            if (!code) {
              match = body.match(/\*\*(\d{8})\*\*/);
              if (match) code = match[1];
            }

            // Cách 2.5: *12345678* (Garena text version)
            if (!code) {
              match = body.match(/\*(\d{8})\*/);
              if (match) code = match[1];
            }

            // Cách 3: Bất kỳ 8 chữ số
            if (!code) {
              match = body.match(/\b(\d{8})\b/);
              if (match) code = match[1];
            }

            if (code) {
              // Kiểm tra mã mới có trùng với mã cũ không (có thể là email cũ)
              if (currentCode !== null && code === currentCode && retryCount < MAX_RETRY + 30) {
                addLog(`⚠️ Mã "${code}" trùng với mã cũ, tiếp tục đợi mã mới...`, 'info');
                await new Promise(resolve => setTimeout(resolve, 3000));
                return fetchCode(retryCount + 1);
              }

              // Cập nhật mã hiện tại
              currentCode = code;

              if (retryCount > 0) {
                addLog(`✓ Tìm thấy mã mới: ${code} (sau ${retryCount} lần check)`, 'success');
              } else {
                addLog(`✓ Tìm thấy mã: ${code}`, 'success');
              }
              showResult(`✅ Mã xác minh cho ${actualEmail}`, 'success', code);
              // Tự động copy mã vào clipboard
              await autoCopyCode(code);
            } else {
              addLog('❌ Không tìm thấy mã 8 chữ số', 'error');
              showResult('❌ Không tìm thấy mã xác minh trong email', 'error');
            }
          } else {
            throw new Error('Cấu trúc dữ liệu không hợp lệ (không có body)');
          }
        } else {
          throw new Error('Cấu trúc dữ liệu không hợp lệ (không phải mảng)');
        }

      } catch (error) {
        addLog(`❌ Lỗi: ${error.message}`, 'error');
        showResult(`❌ Lỗi: ${error.message}`, 'error');
      } finally {
        // Chỉ mờ nút khi đã kết thúc đệ quy
        if (retryCount === 0 || error) {
          btnText.textContent = originalText;
          btn.disabled = false;
        }
      }
    }

    // Enter để gọi API
    document.getElementById('username').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') fetchCode();
    });
  </script>

</body>

</html>
